id: desktop.csharp-winforms-tool
name: C# WinForms Tool
version: 1.0.0
engineVersion: ">=1.0.0 <2.0.0"
tools:
  - id: dotnet
    version: ">=10.0.0 <11.0.0"
    required: true
features: []
actions:
  - id: copy-source
    handler: copy-overlay
    timeoutSeconds: 30
    parameters:
      source: 'overlays\base\src'
      target: src
  - id: copy-tests
    handler: copy-overlay
    timeoutSeconds: 30
    parameters:
      source: 'overlays\base\tests'
      target: tests
  - id: render-solution
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source: 'templates\TeamTool.slnx'
      target: TeamTool.slnx
  - id: render-build
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source: 'templates\Directory.Build.props'
      target: Directory.Build.props
  - id: render-packages
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source: 'templates\Directory.Packages.props'
      target: Directory.Packages.props
  - id: render-sdk
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source: 'templates\global.json'
      target: global.json
  - id: render-editor
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source: 'templates\.editorconfig'
      target: .editorconfig
  - id: render-gitignore
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source: 'templates\.gitignore'
      target: .gitignore
  - id: render-readme
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source: 'templates\README.md'
      target: README.md
  - id: render-architecture
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source: 'templates\ARCHITECTURE.md'
      target: ARCHITECTURE.md
  - id: render-contributing
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source: 'templates\CONTRIBUTING.md'
      target: CONTRIBUTING.md
  - id: render-development
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source: 'templates\DEVELOPMENT.md'
      target: DEVELOPMENT.md
  - id: render-testing
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source: 'templates\TESTING.md'
      target: TESTING.md
  - id: render-deployment
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source: 'templates\DEPLOYMENT.md'
      target: DEPLOYMENT.md
  - id: render-team-start
    handler: render-template
    timeoutSeconds: 30
    parameters:
      source: 'templates\TEAM_START_HERE.md'
      target: TEAM_START_HERE.md
  - id: restore
    handler: package-install
    timeoutSeconds: 300
    parameters:
      packageManager: dotnet
      arguments:
        - restore
        - TeamTool.slnx
        - --locked-mode
      workingDirectory: .
validators:
  - id: format
    handler: validate-command
    timeoutSeconds: 180
    required: true
    parameters:
      executable: dotnet
      arguments:
        - format
        - TeamTool.slnx
        - --verify-no-changes
        - --no-restore
      workingDirectory: .
      allowedExitCodes:
        - 0
      required: true
  - id: build
    handler: validate-command
    timeoutSeconds: 300
    required: true
    parameters:
      executable: dotnet
      arguments:
        - build
        - TeamTool.slnx
        - --configuration
        - Release
        - --no-restore
      workingDirectory: .
      allowedExitCodes:
        - 0
      required: true
  - id: test
    handler: validate-command
    timeoutSeconds: 300
    required: true
    parameters:
      executable: dotnet
      arguments:
        - test
        - TeamTool.slnx
        - --configuration
        - Release
        - --no-build
        - --no-restore
      workingDirectory: .
      allowedExitCodes:
        - 0
      required: true
  - id: publish-smoke
    handler: validate-command
    timeoutSeconds: 300
    required: true
    parameters:
      executable: dotnet
      arguments:
        - publish
        - 'src\TeamTool.Desktop\TeamTool.Desktop.csproj'
        - --configuration
        - Release
        - --no-restore
        - --property:PublishProfile=WindowsSmoke
      workingDirectory: .
      allowedExitCodes:
        - 0
      required: true
artifacts:
  - path: TeamTool.slnx
  - path: Directory.Build.props
  - path: Directory.Packages.props
  - path: README.md
  - path: ARCHITECTURE.md
  - path: CONTRIBUTING.md
  - path: DEVELOPMENT.md
  - path: TESTING.md
  - path: DEPLOYMENT.md
  - path: TEAM_START_HERE.md
  - path: 'src\TeamTool.Desktop\TeamTool.Desktop.csproj'
  - path: 'src\TeamTool.Domain\TeamTool.Domain.csproj'
  - path: 'src\TeamTool.Application\TeamTool.Application.csproj'
  - path: 'src\TeamTool.Infrastructure\TeamTool.Infrastructure.csproj'
  - path: 'tests\TeamTool.UnitTests\TeamTool.UnitTests.csproj'
dependencies:
  - id: communitytoolkit.mvvm
    version: 8.4.2
  - id: microsoft.extensions.hosting
    version: 10.0.10
  - id: microsoft.net.test.sdk
    version: 17.14.1
  - id: xunit
    version: 2.9.3
  - id: xunit.runner.visualstudio
    version: 3.1.4
