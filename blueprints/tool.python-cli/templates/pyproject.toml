[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "{{ project.safe_name }}"
version = "0.1.0"
description = "A production Python CLI generated by DevForge Studio."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
team-tool = "team_tool.cli:main"

[dependency-groups]
dev = [
  "build==1.5.0",
  "hatchling==1.32.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/team_tool"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/pyproject.toml",
  "/README.md",
  "/uv.lock",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["team_tool"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-q"]
testpaths = ["tests"]
